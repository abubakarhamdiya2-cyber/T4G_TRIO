<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment Dashboard</title>
    <link rel="stylesheet" href="src/style.css">
</head>
<body>

    <main class="dashboard-container">
        <div class="card">
            <div class="card-banner purple"></div>
            <div class="card-content">
                <h3 class="card-title">Assessment</h3>
                <p class="card-percentage">79%</p>
            </div>
        </div>

        <div class="card">
            <div class="card-banner cyan"></div>
            <div class="card-content">
                <h3 class="card-title">Assessment 1</h3>
                <p class="card-percentage">100%</p>
            </div>
        </div>

        <div class="card">
            <div class="card-banner green"></div>
            <div class="card-content">
                <h3 class="card-title">Assessment 2</h3>
                <p class="card-percentage">85%</p>
            </div>
        </div>

        <div class="card">
            <div class="card-banner beige"></div>
            <div class="card-content">
                <h3 class="card-title">Assessment 3</h3>
                <p class="card-percentage">67%</p>
            </div>
        </div>
    </main>

</body>
</html>
